<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Filas FICCT</title>
    <link rel="stylesheet" href="../css/global.css">
</head>
<body class="full-center-container">
    <div class="custom-card">
        <div class="text-center" style="margin-bottom: 2rem;">
            <h1 style="font-size: 2.5rem; margin-bottom: 0;">FICCT</h1>
            <p class="text-muted-custom">Gestión de Trámites Universitarios</p>
        </div>

        <h2 class="text-center">Iniciar Sesión</h2>
        
        <div id="mensaje-error" class="alert-custom alert-error" style="display: none; margin-bottom: 1rem; text-align: center;"></div>

        <form id="loginForm">
            <div class="form-group">
                <label class="form-label">Registro Universitario</label>
                <input type="number" id="registro" class="form-input" placeholder="Ej. 221043721" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Contraseña</label>
                <input type="password" id="password" class="form-input" placeholder="********" required>
            </div>

            <button type="submit" class="btn-main">Entrar al Sistema</button>
        </form>

        <div class="text-center" style="margin-top: 1.5rem;">
            <p class="text-muted-custom">
                ¿Eres nuevo? <a href="registro.html" style="color: var(--primary-color); font-weight: 600;">Regístrate aquí</a>
            </p>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', handleLogin);

        localStorage.clear();
    </script>
</body>
</html>
